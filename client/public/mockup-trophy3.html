<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=390"><title>Trophy 3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#050e1c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.screen{width:390px;min-height:844px;background:#050e1c;display:flex;flex-direction:column;align-items:center;padding:52px 24px 40px;position:relative;overflow:hidden;}

/* Streaks / particle dots */
.dot{position:absolute;border-radius:50%;pointer-events:none;}
.d1{width:4px;height:4px;background:#fbbf24;opacity:.4;top:120px;left:60px;}
.d2{width:3px;height:3px;background:#fbbf24;opacity:.25;top:180px;right:55px;}
.d3{width:5px;height:5px;background:#06b6d4;opacity:.2;top:100px;right:80px;}
.d4{width:3px;height:3px;background:#fbbf24;opacity:.35;top:240px;left:40px;}
.d5{width:4px;height:4px;background:#06b6d4;opacity:.15;bottom:200px;right:50px;}
.d6{width:2px;height:2px;background:#fbbf24;opacity:.5;top:320px;right:70px;}

.x{position:absolute;top:20px;right:20px;color:#1e3a5f;font-size:18px;z-index:2;}

/* Header: two avatar columns with VS banner */
.header{display:flex;align-items:flex-start;width:100%;max-width:320px;gap:0;margin-bottom:24px;z-index:1;}
.player-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.av-frame{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;}
.av-you{background:rgba(251,191,36,0.15);border:1.5px solid rgba(251,191,36,0.5);box-shadow:0 0 24px rgba(251,191,36,.25);}
.av-them{background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.2);}
.av-name{font-size:11px;font-weight:700;color:#475569;letter-spacing:.06em;}
.av-score{font-size:22px;font-weight:900;}
.av-score.win{color:#fbbf24;}
.av-score.lose{color:#1e3a5f;}
.vs-col{display:flex;align-items:center;padding-top:20px;}
.vs-banner{background:#0d1f38;border:1px solid #1e3a5f;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:900;color:#334155;}

/* Result strip */
.result-strip{width:100%;max-width:320px;border-radius:20px;background:linear-gradient(135deg,rgba(251,191,36,0.12),rgba(251,191,36,0.04));border:1px solid rgba(251,191,36,0.25);padding:16px 20px;text-align:center;margin-bottom:20px;z-index:1;}
.rs-top{font-size:20px;font-weight:900;color:#fef3c7;letter-spacing:-.01em;}
.rs-sub{font-size:12px;color:#92400e;margin-top:2px;}

/* Stats row */
.stats-row{display:flex;width:100%;max-width:320px;gap:10px;margin-bottom:20px;z-index:1;}
.stat-box{flex:1;background:#0a1a2e;border:1px solid #0f2540;border-radius:16px;padding:12px;text-align:center;}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#1e3a5f;margin-bottom:4px;}
.stat-val{font-size:18px;font-weight:900;color:#cbd5e1;}
.stat-val.hi{color:#fbbf24;}

/* Cold take */
.cold-take{width:100%;max-width:320px;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.18);border-radius:20px;padding:14px 18px;text-align:center;margin-bottom:auto;margin-top:4px;z-index:1;}
.ct-ice{font-size:16px;margin-bottom:4px;}
.ct-text{font-size:14px;font-weight:600;color:#fcd34d;line-height:1.4;}

/* Actions */
.actions{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;z-index:1;margin-top:24px;}
.btn-share{width:100%;padding:14px;border-radius:18px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;background:linear-gradient(135deg,#b45309,#fbbf24);color:#1c0f00;box-shadow:0 0 20px rgba(251,191,36,.3);}
.btn-continue{width:100%;padding:10px;background:none;border:none;color:#334155;font-size:13px;cursor:pointer;}
</style></head>
<body>
<div class="screen">
  <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>
  <div class="dot d4"></div><div class="dot d5"></div><div class="dot d6"></div>
  <span class="x">✕</span>

  <div class="header">
    <div class="player-col">
      <div class="av-frame av-you">🏆</div>
      <div class="av-name">YOU</div>
      <div class="av-score win">11.7</div>
    </div>
    <div class="vs-col"><div class="vs-banner">VS</div></div>
    <div class="player-col">
      <div class="av-frame av-them">🥶</div>
      <div class="av-name">RACHAEL</div>
      <div class="av-score lose">11.4</div>
    </div>
  </div>

  <div class="result-strip">
    <div class="rs-top">Ice in your veins. ❄️</div>
    <div class="rs-sub">Winner by 0.3 points</div>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-label">Margin</div><div class="stat-val hi">+0.3</div></div>
    <div class="stat-box"><div class="stat-label">Your streak</div><div class="stat-val">12🔥</div></div>
    <div class="stat-box"><div class="stat-label">vs Rachael</div><div class="stat-val hi">3W</div></div>
  </div>

  <div class="cold-take">
    <div class="ct-ice">❄️</div>
    <div class="ct-text">Still thawing out, Rachael?</div>
  </div>

  <div class="actions">
    <button class="btn-share">⬆ Share your brag 🏆</button>
    <button class="btn-continue">Continue</button>
  </div>
</div>
</body></html>
