<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=390"><title>Bold</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#040f1e;font-family:'Inter',-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}

.screen{
  width:390px;height:100vh;
  background:#040f1e;
  display:flex;flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:48px 24px 44px;
  position:relative;overflow:hidden;
}

/* ── No texture — clean navy ── */
.texture{display:none;}
/* Warm glow at top */
.glow-top{
  position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:340px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,191,36,0.15) 0%,transparent 65%);
  pointer-events:none;
}

.x{position:absolute;top:20px;right:20px;color:#0d2340;font-size:18px;z-index:2;}

/* ── Avatars row ── */
.avatars{display:flex;align-items:center;gap:20px;z-index:1;}
.av-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.av{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;}
.av-you{background:rgba(251,191,36,0.15);border:1.5px solid rgba(251,191,36,0.5);box-shadow:0 0 20px rgba(251,191,36,0.2);}
.av-them{background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.2);}
.av-name{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8;}
.vs-divider{color:#94a3b8;font-size:16px;font-weight:900;padding-bottom:20px;}

/* ── Big headline ── */
.headline-block{text-align:center;z-index:1;}
.hl-top{
  font-size:52px;font-weight:900;
  letter-spacing:-.03em;line-height:.95;
  text-transform:uppercase;
  color:#fbbf24;
  filter:drop-shadow(0 0 30px rgba(251,191,36,.35));
}
.hl-bot{
  font-size:52px;font-weight:900;
  letter-spacing:-.03em;line-height:.95;
  text-transform:uppercase;
  color:#f8fafc;
}
.hl-sub{font-size:13px;color:#94a3b8;margin-top:10px;font-weight:400;}

/* ── Two score circles ── */
.circles{display:flex;align-items:center;justify-content:center;gap:20px;z-index:1;}
.circle{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.circle-you{background:#fbbf24;box-shadow:0 0 40px rgba(251,191,36,.3);}
.circle-them{background:transparent;border:2px solid #0d2340;}
.c-score{font-size:42px;font-weight:900;line-height:1;letter-spacing:-.02em;}
.c-score-you{color:#1a0a00;}
.c-score-them{color:#ffffff;opacity:0.45;}
.c-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.c-label-you{color:rgba(26,10,0,0.6);}
.c-label-them{color:#ffffff;opacity:0.45;}

/* ── Cold take ── */
.cold-take{
  width:100%;max-width:320px;
  border-left:2px solid rgba(251,191,36,.35);
  padding:4px 0 4px 14px;
  z-index:1;
}
.ct-text{font-size:15px;font-style:italic;color:#94a3b8;line-height:1.4;font-weight:400;}
.ct-attr{font-size:10px;color:#94a3b8;opacity:0.6;margin-top:4px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}

/* ── CTA ── */
.actions{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;z-index:1;}
.btn-share{
  width:100%;padding:16px;border-radius:14px;
  font-weight:800;font-size:15px;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:none;cursor:pointer;
  background:#fbbf24;color:#1a0a00;
  box-shadow:0 0 30px rgba(251,191,36,.25);
}
.btn-continue{width:100%;padding:10px;background:none;border:none;color:#94a3b8;font-size:13px;cursor:pointer;}
</style></head>
<body>
<div class="screen">
  <div class="texture"></div>
  <div class="glow-top"></div>
  <span class="x">✕</span>

  <div class="avatars">
    <div class="av-wrap">
      <div class="av av-you">🏆</div>
      <div class="av-name">You</div>
    </div>
    <div class="vs-divider">VS</div>
    <div class="av-wrap">
      <div class="av av-them">🥶</div>
      <div class="av-name">Rachael</div>
    </div>
  </div>

  <div class="headline-block">
    <div class="hl-top">Challenge</div>
    <div class="hl-bot">Won</div>
    <div class="hl-sub">Still thawing out, Rachael? ❄️</div>
  </div>

  <div class="circles">
    <div class="circle circle-you">
      <div class="c-score c-score-you">11.7</div>
      <div class="c-label c-label-you">Your score</div>
    </div>
    <div class="circle circle-them">
      <div class="c-score c-score-them">11.4</div>
      <div class="c-label c-label-them">Rachael</div>
    </div>
  </div>

  <div class="cold-take">
    <div class="ct-text">"Ice in your veins. You won by 0.3 points."</div>
    <div class="ct-attr">ColdStreak ❄</div>
  </div>

  <div class="actions">
    <button class="btn-share">⬆ Share your brag 🏆</button>
    <button class="btn-continue">Continue</button>
  </div>
</div>
</body></html>
