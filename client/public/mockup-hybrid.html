<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=390"><title>Hybrid</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#040810;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.screen{width:390px;min-height:844px;background:#040810;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:52px 28px 44px;position:relative;overflow:hidden;}

/* Ambient glow behind the quote */
.glow{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:340px;height:260px;border-radius:50%;background:radial-gradient(ellipse,rgba(251,191,36,0.1) 0%,transparent 70%);pointer-events:none;}

.x{position:absolute;top:20px;right:22px;color:#1e3a5f;font-size:18px;z-index:2;}

/* ── A-style head-to-head ── */
.hth{width:100%;max-width:320px;display:flex;align-items:center;justify-content:space-between;z-index:1;}
.player{display:flex;flex-direction:column;align-items:center;gap:8px;}
.av{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;}
.av-you{background:rgba(251,191,36,0.14);border:1.5px solid rgba(251,191,36,0.45);box-shadow:0 0 22px rgba(251,191,36,.2);}
.av-them{background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.2);}
.p-name{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#475569;}
.p-score{font-size:30px;font-weight:900;letter-spacing:-.02em;}
.p-score.win{color:#fbbf24;filter:drop-shadow(0 0 10px rgba(251,191,36,.45));}
.p-score.lose{color:#1e3a5f;}
.vs-col{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:32px;}
.vs-text{font-size:13px;font-weight:900;color:#1e3a5f;}
.margin-pill{padding:3px 10px;border-radius:999px;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);font-size:9px;font-weight:700;color:#92400e;letter-spacing:.06em;white-space:nowrap;}

/* ── Thin rule ── */
.rule{width:100%;max-width:320px;height:1px;background:linear-gradient(to right,transparent,rgba(251,191,36,0.2),transparent);z-index:1;}

/* ── C-style cold take ── */
.editorial{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:320px;z-index:1;padding:8px 0;}
.ct-big{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:40px;line-height:1.15;text-align:center;letter-spacing:-.01em;background:linear-gradient(150deg,#fffbeb 0%,#fbbf24 55%,#d97706 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 24px rgba(251,191,36,.2));}

/* ── Bottom ── */
.bottom{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;z-index:1;}
.win-label{text-align:center;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#334155;}
.btn-share{width:100%;padding:14px;border-radius:18px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;background:linear-gradient(135deg,#b45309,#fbbf24);color:#1c0f00;box-shadow:0 0 24px rgba(251,191,36,.3);}
.btn-continue{width:100%;padding:10px;background:none;border:none;color:#1e3a5f;font-size:13px;cursor:pointer;}
</style></head>
<body>
<div class="screen">
  <div class="glow"></div>
  <span class="x">✕</span>

  <!-- A-style: avatars + scores -->
  <div class="hth">
    <div class="player">
      <div class="av av-you">🏆</div>
      <div class="p-name">You</div>
      <div class="p-score win">11.7</div>
    </div>
    <div class="vs-col">
      <div class="vs-text">VS</div>
      <div class="margin-pill">+0.3</div>
    </div>
    <div class="player">
      <div class="av av-them">🥶</div>
      <div class="p-name">Rachael</div>
      <div class="p-score lose">11.4</div>
    </div>
  </div>

  <div class="rule"></div>

  <!-- C-style: cold take as typographic hero -->
  <div class="editorial">
    <div class="ct-big">Still thawing out, Rachael?</div>
  </div>

  <!-- Bottom actions -->
  <div class="bottom">
    <div class="win-label">Ice in your veins. ❄️</div>
    <button class="btn-share">⬆ Share your brag 🏆</button>
    <button class="btn-continue">Continue</button>
  </div>
</div>
</body></html>
