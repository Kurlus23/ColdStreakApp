<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=390"><title>Bold — Lose</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#040f1e;font-family:'Inter',-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}

.screen{
  width:390px;min-height:844px;
  background:#040f1e;
  display:flex;flex-direction:column;
  align-items:center;
  padding:48px 24px 44px;
  position:relative;overflow:hidden;
}

/* Cyan glow at top for lose state */
.glow-top{
  position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:340px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(6,182,212,0.12) 0%,transparent 65%);
  pointer-events:none;
}

.x{position:absolute;top:20px;right:20px;color:#0d2340;font-size:18px;z-index:2;}

/* ── Avatars row ── */
.avatars{display:flex;align-items:center;gap:20px;margin-bottom:28px;z-index:1;}
.av-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.av{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;}
.av-you{background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.2);}
.av-them{background:rgba(251,191,36,0.15);border:1.5px solid rgba(251,191,36,0.5);box-shadow:0 0 20px rgba(251,191,36,0.2);}
.av-name{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#475569;}
.vs-divider{color:#334155;font-size:16px;font-weight:900;padding-bottom:20px;}

/* ── Big headline — lose state ── */
.headline-block{text-align:center;margin-bottom:32px;z-index:1;}
.hl-top{
  font-size:52px;font-weight:900;
  letter-spacing:-.03em;line-height:.95;
  text-transform:uppercase;
  color:#22d3ee;
  filter:drop-shadow(0 0 24px rgba(34,211,238,.25));
}
.hl-bot{
  font-size:52px;font-weight:900;
  letter-spacing:-.03em;line-height:.95;
  text-transform:uppercase;
  color:#f8fafc;
}
.hl-sub{font-size:13px;color:#1e3a5f;margin-top:10px;font-weight:400;}

/* ── Two score circles — flipped ── */
.circles{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:32px;z-index:1;}
.circle{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
/* Rachael's circle is gold (she won) */
.circle-them{background:#fbbf24;box-shadow:0 0 40px rgba(251,191,36,.3);}
/* Mine is dark outlined (I lost) */
.circle-you{background:transparent;border:2px solid #0d2340;}
.c-score{font-size:42px;font-weight:900;line-height:1;letter-spacing:-.02em;}
.c-score-them{color:#1a0a00;}
.c-score-you{color:#475569;}
.c-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.c-label-them{color:rgba(26,10,0,0.6);}
.c-label-you{color:#64748b;}

/* ── Cold take ── */
.cold-take{
  width:100%;max-width:320px;
  border-left:2px solid rgba(34,211,238,.3);
  padding:4px 0 4px 14px;
  margin-bottom:32px;z-index:1;
}
.ct-text{font-size:15px;font-style:italic;color:#475569;line-height:1.4;font-weight:400;}
.ct-attr{font-size:10px;color:#334155;margin-top:4px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}

/* ── CTA — lose state ── */
.actions{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;z-index:1;}
.btn-rematch{
  width:100%;padding:16px;border-radius:14px;
  font-weight:800;font-size:15px;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid rgba(34,211,238,.4);cursor:pointer;
  background:transparent;color:#22d3ee;
}
.btn-continue{width:100%;padding:10px;background:none;border:none;color:#475569;font-size:13px;cursor:pointer;}
</style></head>
<body>
<div class="screen">
  <div class="glow-top"></div>
  <span class="x">✕</span>

  <div class="avatars">
    <div class="av-wrap">
      <div class="av av-you">🥶</div>
      <div class="av-name">You</div>
    </div>
    <div class="vs-divider">VS</div>
    <div class="av-wrap">
      <div class="av av-them">🏆</div>
      <div class="av-name">Rachael</div>
    </div>
  </div>

  <div class="headline-block">
    <div class="hl-top">Challenge</div>
    <div class="hl-bot">Lost</div>
    <div class="hl-sub">Rachael beat you by 0.3 points ❄️</div>
  </div>

  <div class="circles">
    <div class="circle circle-you">
      <div class="c-score c-score-you">11.4</div>
      <div class="c-label c-label-you">Your score</div>
    </div>
    <div class="circle circle-them">
      <div class="c-score c-score-them">11.7</div>
      <div class="c-label c-label-them">Rachael</div>
    </div>
  </div>

  <div class="cold-take">
    <div class="ct-text">"The cold doesn't care. Get back in."</div>
    <div class="ct-attr">ColdStreak ❄</div>
  </div>

  <div class="actions">
    <button class="btn-rematch">❄ Challenge Rachael again</button>
    <button class="btn-continue">Continue</button>
  </div>
</div>
</body></html>
